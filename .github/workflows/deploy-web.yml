name: Deploy Web Build to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  export-and-deploy:
    runs-on: ubuntu-latest
    # Мы убрали container: image: steefers/...
    # Теперь используем чистую Ubuntu и ставим Redot 26.3 сами

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Redot 26.3 Binary and Templates
        run: |
          # 1. Качаем бинарник редактора Redot 26.3 для Linux
          wget -q https://github.com/Redot-Engine/redot-engine/releases/download/redot-26.3-stable/Redot_v26.3-stable_linux.x86_64.zip -O /tmp/redot.zip

          # 2. Распаковываем бинарник
          mkdir -p /tmp/redot-bin
          unzip -q /tmp/redot.zip -d /tmp/redot-bin

          # Делаем его исполняемым и добавляем в PATH
          chmod +x /tmp/redot-bin/Redot_v26.3-stable_linux.x86_64
          echo "/tmp/redot-bin" >> $GITHUB_PATH

          # Переименовываем для удобства вызова
          mv /tmp/redot-bin/Redot_v26.3-stable_linux.x86_64 /tmp/redot-bin/redot

          # 3. Качаем шаблоны экспорта для версии 26.3
          wget -q https://github.com/Redot-Engine/redot-engine/releases/download/redot-26.3-stable/Redot_v26.3-stable_export_templates.tpz -O /tmp/redot-templates.tpz

          # 4. Создаем правильную папку для шаблонов (обратите внимание на "redot", а не "godot")
          mkdir -p ~/.local/share/redot/export_templates/26.3.stable

          # 5. Распаковываем шаблоны
          unzip -q /tmp/redot-templates.tpz -d /tmp/redot-templates
          mv /tmp/redot-templates/templates/* ~/.local/share/redot/export_templates/26.3.stable/

      - name: Export Web Build
        run: |
          mkdir -v -p build/web
          # Теперь вызываем наш скачанный redot
          redot --headless --verbose --export-release "Web" ./build/web/index.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4