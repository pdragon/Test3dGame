name: Deploy Web Build to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  export-and-deploy:
    runs-on: ubuntu-latest
    container:
      image: steefers/redot-ci:web-4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and Setup Redot Web Export Templates
        run: |
          # 1. Качаем шаблоны по твоей ссылке
          wget -q https://github.com/Redot-Engine/redot-engine/releases/download/redot-26.3-stable/Redot_v26.3-stable_export_templates.tpz -O /tmp/redot-templates.tpz

          # 2. Создаем папку, куда Redot/Godot ожидает их увидеть
          mkdir -p ~/.local/share/godot/export_templates/26.3.stable

          # 3. Распаковываем .tpz (это обычный zip) во временную папку
          unzip -q /tmp/redot-templates.tpz -d /tmp/redot-templates

          # 4. Перемещаем файлы из внутренней папки "templates" в нужную директорию
          mv /tmp/redot-templates/templates/* ~/.local/share/godot/export_templates/26.3.stable/

      - name: Export Web Build
        run: |
          mkdir -v -p build/web
          # Вызываем бинарник redot (так как это CI-образ для Redot)
          redot --headless --verbose --export-release "Web" ./build/web/index.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4